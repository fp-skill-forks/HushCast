name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Compile (no code signing)
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild -project Hushcast.xcodeproj -target Hushcast \
            -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Hushcast.app Payload/
          zip -qry Hushcast.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Hushcast-ipa
          path: Hushcast.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
